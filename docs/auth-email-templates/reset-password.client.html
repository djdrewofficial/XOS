<!-- Client-app copy. Do not paste this into the shared Supabase Reset
     password template. Staff forgot-password uses that same template.
     Not applied to the live project. -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Xpress DJs password</title>
</head>
<body style="margin:0;padding:0;background:#f4f2fa;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2fa;">
    <tr>
      <td align="center" style="padding:28px 14px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e8e4f3;border-radius:16px;">
          <tr>
            <td align="center" style="background:#4b328e;padding:30px;">
              <img src="https://xos.xpressdjs.com/logo-dark.png" alt="Xpress DJs" width="210" style="display:block;border:0;max-width:210px;height:auto;" />
            </td>
          </tr>
          <tr>
            <td style="padding:30px;font-family:Arial,Helvetica,sans-serif;color:#1d1d22;">
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-family:Arial,Helvetica,sans-serif;color:#1d1d22;">Reset your Xpress DJs password</h1>
              <p style="margin:0 0 8px;font-size:15px;line-height:1.6;font-family:Arial,Helvetica,sans-serif;color:#4a4a52;">We received a request to reset your Xpress DJs password. Follow the link below to choose a new one. It opens in the browser if the app is not installed.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:26px auto;">
                <tr>
                  <td align="center" style="background:#4b328e;border-radius:10px;">
                    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:13px 30px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Reset password</a>
                  </td>
                </tr>
              </table>
              <p style="margin:8px 0 0;font-size:12px;line-height:1.6;font-family:Arial,Helvetica,sans-serif;color:#8a8a94;">If you didn’t request this, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
