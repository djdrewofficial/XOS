<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your password</title><!--[if !mso]><!-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Montserrat:wght@400;700&amp;display=swap">
<!--<![endif]-->
<style type="text/css">@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;700&display=swap');
@media only screen and (max-width:480px){.email-content{padding:26px 22px!important;}}
</style>
<!--[if mso]><style type="text/css">body,table,td,p,a{font-family:Arial,sans-serif!important;}h1{font-family:Georgia,serif!important;}</style><![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f6f2ff;color:#120c1e;font-family:Montserrat,Arial,sans-serif;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f6f2ff;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
<tr><td align="center" style="padding:0;background-color:#4b328e;border-radius:16px 16px 0 0;overflow:hidden;">
<img src="https://xpressdjs.com/images/og-default.png" alt="Xpress Entertainment" width="560" border="0" style="display:block;width:100%;max-width:560px;height:auto;border:0;border-radius:16px 16px 0 0;color:#ffffff;font-family:Montserrat,Arial,sans-serif;font-size:20px;">
</td></tr>
<tr><td style="height:4px;background-color:#fe3a3b;font-size:0;line-height:0;">&nbsp;</td></tr>
<tr><td class="email-content" style="padding:32px 28px 30px;background-color:#ffffff;border-radius:0 0 16px 16px;">
<h1 style="margin:0 0 20px;color:#120c1e;font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:38px;font-weight:400;">Reset your password</h1>
<p style="margin:0 0 26px;font-size:16px;line-height:26px;color:#5a4f6e;">We received a request to reset your password. Use the button below to choose a new one.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;"><tr><td align="center" bgcolor="#4b328e" style="background-color:#4b328e;border-radius:8px;mso-padding-alt:16px 26px;">
<a href="{{ if eq .RedirectTo "xpressclient://auth/reset" }}https://xos.xpressdjs.com/auth/reset?token_hash={{ .TokenHash }}&type=recovery{{ else }}{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery{{ end }}" style="display:inline-block;padding:16px 26px;border:1px solid #4b328e;border-radius:8px;color:#ffffff;font-family:Montserrat,Arial,sans-serif;font-size:16px;line-height:22px;font-weight:700;text-align:center;text-decoration:none;">Reset password</a>
</td></tr></table>
<p style="margin:0;padding-top:22px;border-top:1px solid #e4dcf1;color:#5a4f6e;font-size:14px;line-height:23px;">If you didn't request this, you can ignore this email.</p>
</td></tr></table></td></tr></table>
</body></html>
