# XOS — Netlify deployment
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # PAYPAL_ENV is not a secret — its value ("sandbox"/"live") is a common word that
  # the secrets scanner finds as plain source text (the "sandbox" fallback + the
  # sandbox API URL in src/lib/paypal.ts). Omit it so the build doesn't false-fail.
  SECRETS_SCAN_OMIT_KEYS = "PAYPAL_ENV"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# MCP OAuth discovery (RFC 9728 / RFC 8414) is served by Next.js App Router:
#   src/app/.well-known/oauth-protected-resource/**
#   src/app/.well-known/oauth-authorization-server/**
# Allow cross-origin metadata reads from agent hosts.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/api/mcp/oauth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
